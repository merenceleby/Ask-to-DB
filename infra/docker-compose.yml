services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: bookstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend
    volumes:
      - ../backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    env_file:
      - ../backend/.env
    environment:
      # Overrides .env so local docker-compose always points at the
      # postgres service above, regardless of what DB_PROVIDER/DATABASE_URL say.
      DB_PROVIDER: supabase
      DATABASE_URL: postgresql+psycopg2://postgres:localpassword@postgres:5432/bookstore
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
